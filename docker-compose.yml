services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cityconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cityconnect
      POSTGRES_PASSWORD: cityconnect_password
      POSTGRES_DB: cityconnect
    ports:
      - "5432:5432"
    volumes:
      - cityconnect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cityconnect -d cityconnect"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cityconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - cityconnect_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: cityconnect-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cityconnect
      MINIO_ROOT_PASSWORD: cityconnect_local_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cityconnect_storage_data:/data

volumes:
  cityconnect_postgres_data:
  cityconnect_redis_data:
  cityconnect_storage_data: