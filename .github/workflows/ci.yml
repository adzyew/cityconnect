name: CityConnect CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cityconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cityconnect_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cityconnect_test?schema=public
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @cityconnect/database validate

      - name: Generate Prisma Client
        run: pnpm --filter @cityconnect/database generate

      - name: Apply database migrations
        run: pnpm --filter @cityconnect/database migrate:deploy

      - name: Type-check database package
        run: pnpm --filter @cityconnect/database typecheck

      - name: Lint web application
        run: pnpm --filter @cityconnect/web lint

      - name: Type-check web application
        run: pnpm --filter @cityconnect/web typecheck

      - name: Build web application
        run: pnpm --filter @cityconnect/web build